<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Command Code quota</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:28px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#20242c;background:#fff;font-size:14px}main{max-width:1440px;margin:auto}header,.row{display:flex;align-items:center;justify-content:space-between;gap:16px}header{margin-bottom:28px}h1{font-size:23px;letter-spacing:-.5px;margin:0 0 8px}h2{font-size:15px;margin:0;overflow-wrap:anywhere}p{color:#737b89;margin:8px 0}button{cursor:pointer;background:#fff;border:1px solid #dce0e7;border-radius:8px;padding:10px 15px;color:inherit;font:inherit;font-weight:600;white-space:nowrap}button:hover{background:#f4f6f9}button:disabled{opacity:.5;cursor:wait}button:focus-visible{outline:2px solid #5979e8;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr));gap:20px}.card{border:1px solid #e0e4eb;border-radius:12px;padding:22px;min-width:0}.badge{font-size:12px;background:#f2f4f8;border-radius:6px;padding:4px 8px;color:#5f6878}.identity{font-size:12px;color:#87909f;margin-top:7px}.section{margin:24px 0 18px;border-top:1px solid #edf0f4;padding-top:20px;font-weight:600}.window{margin:20px 0}.label{font-size:13px;font-weight:600}.percent{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}.track{height:7px;background:#edf0f5;border-radius:8px;margin:10px 0;overflow:hidden}.fill{height:100%;background:#6284ea;border-radius:8px}.reset{color:#858d9b;font-size:12px}.credits{border-top:1px solid #edf0f4;padding-top:16px;margin-top:22px;font-size:12px;color:#778090;line-height:1.8}.card button{width:100%;margin-top:18px}.error{color:#bd4138}.status{font-size:12px;min-height:18px;color:#7b8492;margin-top:12px}.empty{padding:48px 20px;border:1px dashed #dce0e7;border-radius:12px;text-align:center;color:#7b8492}footer{color:#9299a4;font-size:12px;margin-top:24px}@media(max-width:560px){body{padding:16px}header{align-items:flex-start}h1{font-size:20px}.card{padding:18px}header button{padding:9px}}
</style></head><body><main><header><div><h1>Command Code 配额</h1><p id="count" aria-live="polite">正在获取账号…</p></div><button id="all">刷新全部账号</button></header><form id="login"><label>管理密钥 <input id="key" type="password" autocomplete="off" required></label> <button>解锁配额</button><p>自动复用同源管理台登录；验证后缓存于当前标签页会话，关闭标签页后清除。</p></form><div id="grid" class="grid"></div><footer>五小时 / 每周为账号共享额度，不按模型重复展示。余额不代表月度窗口；数据缓存 5 分钟。</footer></main>
<script>
const grid=document.querySelector('#grid'),all=document.querySelector('#all');let entries=[],accessKey="";
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el}
async function api(params){const u=new URL(location.href);u.search='';Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u,{cache:'no-store',headers:{Authorization:'Bearer '+accessKey}});if(!r.ok){if(r.status===401){try{sessionStorage.removeItem('commandcode.quota.access')}catch{}accessKey='';document.querySelector('#login').hidden=false;}throw Error('请求失败 ('+r.status+')');}return r.json()}
function windowView(label,w){const box=node('div',undefined,'window'),row=node('div',undefined,'row');const value=w&&w.remainingPercent;const valid=typeof value==='number'&&Number.isFinite(value);row.append(node('span',label,'label'),node('span',valid?Math.round(value)+'%':'—','percent'));box.append(row);const track=node('div',undefined,'track'),fill=node('div',undefined,'fill');fill.style.width=(valid?Math.max(0,Math.min(100,value)):0)+'%';if(valid&&value<20)fill.style.background='#df9b4d';track.append(fill);box.append(track);const date=w&&w.reset_at?new Date(w.reset_at):null;box.append(node('div',date&&!isNaN(date)?'重置时间 '+date.toLocaleString():'上游未提供重置时间','reset'));return box}
function card(a){const root=node('article',undefined,'card'),head=node('div',undefined,'row');head.append(node('h2',a.label),node('span','Command Code','badge'));root.append(head,node('div','账号 '+a.id.slice(0,8),'identity'),node('div','共享套餐额度','section'));const content=node('div');root.append(content);const status=node('div','等待加载','status');status.setAttribute('aria-live','polite');const button=node('button','刷新额度');root.append(status,button);grid.append(root);const entry={a,content,status,button,busy:false};button.onclick=()=>load(entry,true);return entry}
async function load(e,force){if(e.busy)return;e.busy=true;e.button.disabled=true;e.status.textContent='正在获取额度…';try{const d=await api({account:e.a.id,format:'json',...(force?{refresh:'1'}:{})});if(!d.available)throw Error('额度暂不可用，请稍后重试');e.content.replaceChildren(windowView('五小时剩余额度',d.five_hour),windowView('每周剩余额度',d.weekly));const credits=node('div',undefined,'credits');for(const [k,l] of [['monthly_credits','套餐余额'],['purchased_credits','购买余额'],['free_credits','免费余额']])if(typeof d[k]==='number')credits.append(node('div',l+' $'+d[k].toFixed(2)));e.content.append(credits);e.status.className='status';e.status.textContent=(d.cached?'缓存数据':'已更新')+' · '+new Date(d.fetched_at).toLocaleString();}catch(err){e.status.className='status error';e.status.textContent=err.message+'（保留上次成功数据）'}finally{e.busy=false;e.button.disabled=false}}
async function refresh(force){all.disabled=true;try{for(let i=0;i<entries.length;i+=3)await Promise.all(entries.slice(i,i+3).map(e=>load(e,force)))}finally{all.disabled=false}}
async function init(){all.disabled=true;try{const d=await api({accounts:'1'});try{sessionStorage.setItem('commandcode.quota.access',accessKey)}catch{}grid.replaceChildren();entries=d.accounts.map(card);document.querySelector('#login').hidden=true;document.querySelector('#count').textContent=entries.length+' 个账号 · 独立查询与刷新';if(!entries.length)grid.append(node('div','暂无 Command Code 账号，请先通过插件登录添加。','empty'));await refresh(false)}catch(err){document.querySelector('#count').textContent='账号列表加载失败，请点击重试';}finally{all.disabled=false}}
function safeOrigin(){
 if(!['http:','https:'].includes(location.protocol))return false;
 if(location.protocol==='https:'||['localhost','127.0.0.1','[::1]'].includes(location.hostname))return true;
 try{return window.parent!==window&&window.parent.location.origin===location.origin&&window.parent.location.pathname.endsWith('/management.html')}catch{return false}
}
function restoreAccess(){
 if(!safeOrigin())return '';
 try{
  const session=sessionStorage.getItem('commandcode.quota.access');if(session)return session;
  let raw=localStorage.getItem('cli-proxy-auth');if(!raw)return '';
  if(raw.startsWith('enc::v1::')){const key=new TextEncoder().encode('cli-proxy-api-webui::secure-storage|'+location.host+'|'+navigator.userAgent);const bytes=Uint8Array.from(atob(raw.slice(9)),(c,i)=>c.charCodeAt(0)^key[i%key.length]);raw=new TextDecoder().decode(bytes)}
  const parsed=JSON.parse(raw),state=parsed.state||parsed;
  if(!state.apiBase||new URL(state.apiBase,location.origin).origin!==location.origin)return '';
  return typeof state.managementKey==='string'?state.managementKey:'';
 }catch{return ''}
}
all.onclick=()=>entries.length?refresh(true):init();document.querySelector('#login').onsubmit=e=>{e.preventDefault();if(!safeOrigin()){alert('请通过 SSH 隧道本机地址或 HTTPS 访问');return;}accessKey=document.querySelector('#key').value;document.querySelector('#key').value='';init()};document.querySelector('#count').textContent='请使用 CPA 管理密钥解锁';all.disabled=true;
accessKey=restoreAccess();if(accessKey)init();
</script></body></html>
